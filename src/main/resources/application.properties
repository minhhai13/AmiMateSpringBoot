spring.application.name=AmiMate
server.port=8080

# Postgres
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:amimate_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# JPA / Hibernate
# Keep demo users, devices, and imported chat logs across backend restarts.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Instant always read/write by UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

amimate.factory.secret=${FACTORY_SECRET}

xiaozhi.api.bearer-token=${XIAOZHI_BEARER_TOKEN:}
xiaozhi.api.agent-id=${XIAOZHI_AGENT_ID:2496934}